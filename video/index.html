<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bulltism video player with WebM first and MP4 fallback."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/player.css" />
    <title>Bulltism Video</title>
  </head>
  <body class="video-page">
    <div class="paper-noise" aria-hidden="true"></div>

    <header class="top-strip" aria-label="Bulltism">
      <img src="/assets/logo.png" alt="Logo Bulltism" />
      <a href="/">home</a>
      <a href="/#gallery">gallery</a>
      <a href="/video/" aria-current="page">video</a>
      <div class="nav-socials" aria-hidden="true">
        <span class="nav-social dex-link">
          <img src="/assets/dexscreener.png" alt="" aria-hidden="true" />
        </span>
        <span class="nav-social telegram-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21.5 3.7 2.9 10.9c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.5c.2.7.1 1 1 .3l2.8-2.7 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.1c.3-1.3-.5-1.9-1.5-1.5Z" />
            <path d="m7.8 13.8 10.8-6.9c.5-.3 1-.1.6.2L10.4 15l-.4 4.1" />
          </svg>
        </span>
        <span class="nav-social x-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 4h4.7l11.5 16h-4.7L4 4Z" />
            <path d="m4.2 20 6.9-7.5m2-2.1L19.1 4" />
          </svg>
        </span>
      </div>
    </header>

    <main class="video-main crooked-section">
      <section class="video-player-unit" data-video-player-unit>
        <div class="video-format-switch" data-video-format-choice aria-label="Video format">
          <button class="video-format-choice-button" data-video-format-choice-button="webm" type="button">
            WEBM
          </button>
          <button class="video-format-choice-button" data-video-format-choice-button="mp4" type="button">
            MP4
          </button>
        </div>

        <div class="video-wrapper">
          <span class="video-format-indicator" aria-hidden="true"></span>
          <span class="video-player-status" data-video-status aria-live="polite">NO SIGNAL YET</span>

          <video
            aria-label="Bulltism video feed"
            autoplay
            loop
            muted
            playsinline
            webkit-playsinline
            preload="auto"
            data-video-autoplay="true"
            data-video-player
            data-video-preload="auto"
            data-video-manifest="/api/video"
          >
            <source data-src="/videos/bulltism-video.webm" data-video-source="webm" type="video/webm" />
            <source data-src="/videos/bulltism-video.mp4" data-video-source="mp4" type="video/mp4" />
          </video>
        </div>
      </section>
    </main>

    <script src="/video-cache.js"></script>
    <script type="module" src="/src/video-page.js"></script>
    <script type="module" src="/video-player.js?v=1"></script>
    <script src="/console-signature.js"></script>
  </body>
</html>
